<header class="sticky top-0 z-50 w-full bg-primary-950/90 backdrop-blur-md">
  <div class="mx-auto flex max-w-7xl items-center justify-between px-6 py-4">
    
    <a routerLink="/" class="group flex items-center gap-2 text-lg font-bold tracking-tight text-white">
      <span class="h-2.5 w-2.5 rounded-full bg-accent-primary shadow-sm shadow-red-950/50 group-hover:scale-125 transition-transform"></span>
      <span class="font-heading">Alexander Sickler</span>
      <span class="text-xs font-mono text-slate-500 font-normal">// portfolio</span>
    </a>

    <nav class="flex items-center gap-4 sm:gap-6 text-sm font-medium">
      <a routerLink="/" 
         routerLinkActive="text-accent-primary font-semibold"
         [routerLinkActiveOptions]="{exact: true}"
         class="px-2 py-1 text-slate-300 hover:text-white transition">
        Start
      </a>
      <a routerLink="/projects" 
         routerLinkActive="text-accent-primary font-semibold"
         class="px-2 py-1 text-slate-300 hover:text-white transition">
        Projekte
      </a>
      <a routerLink="/about" 
         routerLinkActive="text-accent-primary font-semibold"
         class="px-2 py-1 text-slate-300 hover:text-white transition">
        Über mich
      </a>
    </nav>

    <div class="hidden sm:block">
      <button appButton variant="secondary" size="sm" routerLink="/contact">
        Kontakt
      </button>
    </div>

  </div>
</header>
