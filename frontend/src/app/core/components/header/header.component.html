<header class="fixed top-0 z-50 w-full backdrop-blur-md">
  <div class="mx-auto flex max-w-7xl items-center justify-between px-6 py-4">
    
    <a [routerLink]="languageService.localizedUrl('/')" class="group flex items-center gap-2 text-lg font-bold text-white">
      <span class="font-heading">Alexander Sickler <span class="font-mono text-xs text-accent-primary whitespace-nowrap">// portfolio</span></span>
      
    </a>

    <nav class="hidden sm:flex items-center gap-6">
      <a [routerLink]="languageService.localizedUrl('/')" routerLinkActive="text-accent-primary" [routerLinkActiveOptions]="{exact: true}" appLink variant="nav">{{ 'nav.home' | translate }}</a>
      <a [routerLink]="languageService.localizedUrl('/projects')" routerLinkActive="text-accent-primary" appLink variant="nav">{{ 'nav.projects' | translate }}</a>
      <a [routerLink]="languageService.localizedUrl('/about')" routerLinkActive="text-accent-primary" appLink variant="nav">{{ 'nav.about' | translate }}</a>
    </nav>

    <div class="hidden sm:block">
      <button appButton variant="secondary" size="sm" [routerLink]="languageService.localizedUrl('/contact')">
        {{ 'nav.contact' | translate }}
      </button>
    </div>

    <label class="sr-only" for="desktop-language">{{ 'language.label' | translate }}</label>
    <select
      id="desktop-language"
      class="language-selector hidden sm:block"
      (change)="onLanguageChange($event)"
      [value]="languageService.currentLanguage()"
    >
      @for (lang of supportedLanguages; track lang) {
        <option [value]="lang" [selected]="lang === languageService.currentLanguage()">{{ lang === 'de' ? '🇩🇪 DE' : '🇬🇧 EN' }}</option>
      }
    </select>

    <details class="mobile-menu sm:hidden">
      <summary class="hamburger-btn" [attr.aria-label]="'nav.menuLabel' | translate">
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
      </summary>

    <div class="mobile-menu-flyout px-6 py-6">
      <nav class="flex flex-col gap-4 items-end">
        <a [routerLink]="languageService.localizedUrl('/')" routerLinkActive="text-accent-primary" [routerLinkActiveOptions]="{exact: true}" appLink variant="nav" class="text-base py-2 text-right">
          {{ 'nav.home' | translate }}
        </a>
        <a [routerLink]="languageService.localizedUrl('/projects')" routerLinkActive="text-accent-primary" appLink variant="nav" class="text-base py-2">
          {{ 'nav.projects' | translate }}
        </a>
        <a [routerLink]="languageService.localizedUrl('/about')" routerLinkActive="text-accent-primary" appLink variant="nav" class="text-base py-2">
          {{ 'nav.about' | translate }}
        </a>
        
        <div class="pt-4">
          <button appButton variant="secondary" size="md" [routerLink]="languageService.localizedUrl('/contact')" class="w-full justify-center">
            {{ 'nav.contactFull' | translate }}
          </button>
        </div>

        <label class="sr-only" for="mobile-language">{{ 'language.label' | translate }}</label>
        <select
          id="mobile-language"
          class="language-selector language-selector--mobile"
          (change)="onLanguageChange($event)"
          [value]="languageService.currentLanguage()"
        >
          @for (lang of supportedLanguages; track lang) {
            <option [value]="lang" [selected]="lang === languageService.currentLanguage()">{{ lang === 'de' ? '🇩🇪 DE' : '🇬🇧 EN' }}</option>
          }
        </select>
      </nav>
    </div>
    </details>

  </div>
</header>
