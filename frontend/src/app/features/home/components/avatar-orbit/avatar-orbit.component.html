<div class="system-field" [attr.aria-label]="'home.avatar.mapLabel' | translate">
  <div class="field-orbit field-orbit--outer" aria-hidden="true"></div>
  <div class="field-orbit field-orbit--inner" aria-hidden="true"></div>
  <span class="field-cross field-cross--one" aria-hidden="true"></span>
  <span class="field-cross field-cross--two" aria-hidden="true"></span>

  <a class="avatar-core" routerLink="/about" [attr.aria-label]="'home.avatar.aboutLabel' | translate">
    <img src="/media/fixtures/avatar-alexander.svg" alt="Alexander Sickler" />
    <span>Alexander</span>
  </a>
  <a class="field-node field-node--interfaces" href="#selected-work" [attr.aria-label]="'home.avatar.interfacesLabel' | translate">
    <span>interfaces</span>
  </a>
  <a class="field-node field-node--media" href="#selected-work" [attr.aria-label]="'home.avatar.mediaLabel' | translate">
    <span>media</span>
  </a>
  <a class="field-node field-node--systems" href="#selected-work" [attr.aria-label]="'home.avatar.systemsLabel' | translate">
    <span>systems</span>
  </a>
  <p class="field-caption">{{ 'home.avatar.caption' | translate }}</p>
</div>
