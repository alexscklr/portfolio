<div class="skills-slider">
  <div class="skills-track" [style.--scroll-duration]="skills().length * 8.3 + 's'">
    @for (isDuplicate of [false, true]; track isDuplicate) {
      <div class="skills-group" [attr.aria-hidden]="isDuplicate ? 'true' : null">
        @for (skill of skills(); track skill.id; let index = $index) {
          <div class="skill-card">
            @if (index < 3) {
              <span class="most-counts">★</span>
            }
            <iconify-icon
              [icon]="skill.iconKey ?? 'lucide:code-2'"
              [attr.aria-label]="skill.name"
              aria-hidden="true"
            >
            </iconify-icon>
            <h3>
              {{ skill.name }}
            </h3>
            <span class="usage-count">
              {{ 'home.skills.usage' | translate }} : {{ skill.usageCount }}</span
            >
          </div>
        }
        <div class="vertical-divider"></div>
      </div>
    }
  </div>
</div>
