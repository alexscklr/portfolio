@if (markdownBlock(); as markdown) {
  <div class="project-markdown" [innerHTML]="renderMarkdown(markdown.content)"></div>
} @else if (calloutBlock(); as callout) {
  <aside class="my-6 rounded-lg border-l-4 p-4" [class]="`callout-${callout.variant}`">
    <p class="text-slate-200">{{ callout.text }}</p>
  </aside>
} @else if (codeBlock(); as code) {
  <figure class="my-6 overflow-hidden rounded-lg border border-white/10 bg-primary-950/70">
    @if (code.fileName) {
      <figcaption class="border-b border-white/10 px-4 py-2 font-mono text-xs text-slate-400">
        {{ code.fileName }}
      </figcaption>
    }
    <pre
      class="overflow-x-auto p-4 text-sm leading-relaxed text-slate-200"
    ><code>{{ code.code }}</code></pre>
  </figure>
}
